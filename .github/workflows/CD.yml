name: Continuous Delivery

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  deploy-vsce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx @vscode/vsce publish --oidc

  deploy-ovsx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run package
      - run: npx ovsx publish --trusted-publishing